<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Hirad Accounting | آفلاین</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Tahoma, Arial, sans-serif;
        background: #0b0f14;
        color: #f1f5f9;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(90vw, 28rem);
        padding: 2rem;
        border: 1px solid #222d38;
        border-radius: 1rem;
        background: #111820;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        color: #fbbf24;
        font-size: 1.25rem;
      }

      p {
        color: #a8b4c3;
        line-height: 1.9;
      }

      button {
        margin-top: 1rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #22c55e;
        color: #052e16;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>فضای کاری آفلاین آماده نیست</h1>
      <p>
        پوستهٔ برنامه یا اطلاعات این حساب هنوز روی این دستگاه آماده نشده است.
        برای آماده‌سازی، اتصال اینترنت را برقرار کنید، وارد حساب شوید و در
        داشبورد تا پایان دریافت اطلاعات اولیه بمانید.
      </p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
